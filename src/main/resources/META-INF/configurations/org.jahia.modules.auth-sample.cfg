siteKey = example
Saml.enabled = true
Saml.relyingPartyIdentifier = test.jahia.com
Saml.incomingTargetUrl = /cms/login.SAML.incoming
Saml.privateKeyPass = changeit_privatekey
Saml.keyStorePass = changeit_keystore
Saml.postLoginPath = /home.html

# Default is 1 day (86400), maximum value allowed is 24 days (2073600)
Saml.maximumAuthenticationLifetime = 2073600

# Accept an identity provider response only when the assertion itself carries a signature.
# Leave this on unless the identity provider signs the response envelope alone.
Saml.requireSignedAssertions = true

# Also demand a signature on the response envelope. Turn this on when the identity
# provider signs both, so the envelope is checked as well.
Saml.requireSignedResponses = false
